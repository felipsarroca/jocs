name: Maniobres
description: Comunica un error o proposa una millora per al joc «Maniobres».
title: "[Maniobres] "
labels: ["Maniobres"]
body:
  - type: dropdown
    id: tipus
    attributes:
      label: Tipus
      options:
        - Error
        - Suggeriment
        - Dubte
    validations:
      required: true
  - type: textarea
    id: descripcio
    attributes:
      label: Descripció
      description: Explica què passa o què t'agradaria millorar.
      placeholder: Escriu-hi el detall...
    validations:
      required: true
  - type: dropdown
    id: mode
    attributes:
      label: Mode de joc
      options:
        - Partida lliure
        - Repte diari
        - Les sis línies
        - Rànquing
        - Laboratori
        - A l'aula (sala amb codi)
        - Contrarellotge
        - El meu progrés
        - Fitxa imprimible / projector
        - Instal·lació al mòbil / pantalla inicial
  - type: textarea
    id: passos
    attributes:
      label: Passos per reproduir-ho
      description: Omple-ho només si es tracta d'un error.
      placeholder: |
        1. Obro...
        2. Clico...
        3. Veig...
  - type: input
    id: dispositiu
    attributes:
      label: Dispositiu i navegador
      placeholder: Ordinador amb Chrome, mòbil Android amb Chrome, iPhone amb Safari...
